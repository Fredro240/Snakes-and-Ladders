<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snakes & Ladders</title>
  <style>
    :root {
      --bg: #000000;
      --surface: #0f172a;
      --text: #f8fafc;
      --muted: #d1d5db;
      --accent: #f8fafc;
      --success: #e5e7eb;
      --danger: #e5e7eb;
      --board-light: #f8fafc;
      --board-dark: #d1d5db;
      --shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #4b5563, #000000 65%);
      color: var(--text);
      font-family: Inter, system-ui, sans-serif;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .app {
      width: min(1200px, 100%);
      display: grid;
      gap: 20px;
      grid-template-columns: 1.25fr 0.75fr;
    }

    .panel, .board-panel {
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.06);
      box-shadow: var(--shadow);
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
    }

    .board-panel {
      display: grid;
      gap: 20px;
    }

    h1, h2 {
      margin: 0 0 14px;
      line-height: 1.1;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    select, button {
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      font-size: 1rem;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
    }

    button {
      cursor: pointer;
      transition: transform .15s ease, background .15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, 0.14);
    }

    .dice {
      width: 120px;
      height: 120px;
      border-radius: 24px;
      display: grid;
      place-items: center;
      font-size: 2.75rem;
      background: linear-gradient(180deg, #000000, #212121);
      color: #f8fafc;
      text-shadow: 0 1px 10px rgba(0,0,0,0.45);
      box-shadow: inset 0 -3px 0 rgba(255,255,255,0.08);
    }

    .status-card {
      display: grid;
      gap: 10px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      padding: 18px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .status-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .status-card strong {
      color: var(--text);
    }

    .board {
      width: 100%;
      aspect-ratio: 1;
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      grid-template-rows: repeat(10, 1fr);
      border-radius: 24px;
      overflow: hidden;
      border: 4px solid rgba(255, 255, 255, 0.16);
      background: #f8fafc;
      min-height: 320px;
      position: relative;
    }

    .board .path-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .square {
      position: relative;
      z-index: 2;
      border: 1px solid rgba(0, 0, 0, 0.12);
      display: grid;
      padding: 6px;
      font-size: clamp(0.7rem, 1vw, 0.95rem);
      overflow: hidden;
    }

    .square[data-light="true"] {
      background: var(--board-light);
    }

    .square[data-light="false"] {
      background: var(--board-dark);
    }

    .square[data-path-type]::before {
      content: attr(data-path-label);
      position: absolute;
      left: 8px;
      top: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      color: #111111;
      text-shadow: 1px 1px 0 rgba(255,255,255,0.9);
    }

    .square[data-path-type="ladder"] {
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12);
    }

    .square[data-path-type="snake"] {
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15);
    }

    .square span {
      position: absolute;
      top: 6px;
      right: 6px;
      color: rgba(15, 23, 42, 0.7);
      font-weight: 700;
    }

    .token-list {
      position: absolute;
      inset: 8px 8px 8px 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: flex-end;
      justify-content: flex-start;
      pointer-events: none;
    }

    .token {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.25);
      border: 2px solid #fff;
    }

    .log {
      display: grid;
      gap: 10px;
      max-height: 300px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .log p {
      margin: 0;
      padding: 12px 14px;
      background: rgba(148, 163, 184, 0.08);
      border-radius: 14px;
      color: var(--text);
      line-height: 1.5;
      font-size: 0.95rem;
    }

    .players {
      display: grid;
      gap: 12px;
      margin-top: 12px;
    }

    .player-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-radius: 16px;
      background: rgba(148, 163, 184, 0.06);
      padding: 14px 16px;
      border: 1px solid rgba(148, 163, 184, 0.1);
    }

    .player-pill {
      width: 14px;
      height: 14px;
      border-radius: 999px;
      margin-right: 10px;
      flex-shrink: 0;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.05);
    }

    .player-info {
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 0.95rem;
      color: var(--text);
    }

    .player-info span {
      color: var(--muted);
    }

    .hint {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 18px;
      line-height: 1.6;
    }

    .grid-stack {
      display: grid;
      gap: 16px;
    }

    .board-header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }

    @media (max-width: 980px) {
      .app {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 14px;
      }

      .controls {
        width: 100%;
        flex-direction: column;
        align-items: stretch;
      }

      select, button {
        width: 100%;
      }

      .dice {
        width: 100%;
        min-height: 110px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <section class="board-panel">
      <div class="board-header">
        <div>
          <h1>Snakes &amp; Ladders</h1>
          <p class="hint">Use one device and name each player before rolling.</p>
        </div>
        <div class="controls">
          <label>
            Players:
            <select id="playerCount">
              <option value="2" selected>2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
            </select>
          </label>
          <button id="newGameBtn" type="button">New game</button>
        </div>
      </div>

      <div class="board" id="board">
        <div class="board-overlay">
          <div class="dice" id="diceFace">-</div>
          <div class="info-card">
            <strong id="turnText">Enter player names and start.</strong>
            <span id="rollText">Roll the dice on the board.</span>
          </div>
        </div>
      </div>

      <div class="player-controls">
        <div class="player-row" id="playerInputs"></div>
        <button id="rollBtn" type="button" disabled>Roll dice</button>
        <div class="player-list" id="playerList"></div>
      </div>
    </section>
  </div>

  <script>
    const boardElement = document.getElementById('board');
    const playerCountSelect = document.getElementById('playerCount');
    const newGameBtn = document.getElementById('newGameBtn');
    const rollBtn = document.getElementById('rollBtn');
    const diceFace = document.getElementById('diceFace');
    const turnText = document.getElementById('turnText');
    const rollText = document.getElementById('rollText');
    const playerInputs = document.getElementById('playerInputs');
    const playerList = document.getElementById('playerList');

    const colors = ['#111111', '#383838', '#6b7280', '#9ca3af', '#d1d5db'];
    const snakeLadder = {
      4: 14, 9: 31, 17: 7, 20: 38, 28: 84, 40: 59, 51: 67, 54: 34,
      62: 19, 63: 81, 64: 60, 71: 91, 87: 24, 93: 73, 95: 75, 99: 78
    };

    let squares = [];
    let players = [];
    let turnIndex = 0;
    let gameActive = false;

    function createPlayerInputs() {
      playerInputs.innerHTML = '';
      const count = Number(playerCountSelect.value);
      for (let i = 0; i < count; i++) {
        const playerInput = document.createElement('div');
        playerInput.className = 'player-input';
        playerInput.innerHTML = `
          <label for="playerName${i}">Player ${i + 1} name</label>
          <input id="playerName${i}" type="text" placeholder="Player ${i + 1}" value="Player ${i + 1}" />
        `;
        playerInputs.appendChild(playerInput);
      }
    }

    function createBoard() {
      boardElement.innerHTML = '';
      squares = [];

      for (let row = 9; row >= 0; row--) {
        const rowNumber = 9 - row;
        const rowSquares = [...Array(10)].map((_, colIndex) => {
          return row * 10 + (rowNumber % 2 === 0 ? 10 - colIndex : colIndex + 1);
        });

        rowSquares.forEach(number => {
          const square = document.createElement('div');
          square.className = 'square';
          const isLight = ((number + Math.floor((number - 1) / 10)) % 2) === 0;
          square.dataset.light = isLight;
          square.id = `square-${number}`;
          square.innerHTML = `<span>${number}</span><div class="token-list"></div>`;

          if (snakeLadder[number]) {
            const destination = snakeLadder[number];
            const type = destination > number ? 'ladder' : 'snake';
            const icon = document.createElement('img');
            icon.className = 'path-icon';
            icon.src = `assets/${type}.svg`;
            icon.alt = type;
            icon.title = `${type === 'ladder' ? 'Ladder' : 'Snake'} to ${destination}`;
            square.appendChild(icon);

            const label = document.createElement('div');
            label.className = 'path-label';
            label.textContent = `${type === 'ladder' ? 'L' : 'S'} → ${destination}`;
            square.appendChild(label);
          }

          boardElement.appendChild(square);
          squares[number] = square;
        });
      }
    }

    function resetGame() {
      const count = Number(playerCountSelect.value);
      players = Array.from({ length: count }, (_, index) => {
        const input = document.getElementById(`playerName${index}`);
        const name = input?.value.trim() || `Player ${index + 1}`;
        return {
          id: index,
          name,
          color: colors[index],
          position: 0
        };
      });
      turnIndex = 0;
      gameActive = true;
      diceFace.textContent = '-';
      rollBtn.disabled = false;
      turnText.textContent = `${players[0].name}'s turn`;
      rollText.textContent = 'Roll the dice on the board.';
      updatePlayersDisplay();
      updateBoardTokens();
    }

    function updatePlayersDisplay() {
      playerList.innerHTML = '';
      players.forEach(player => {
        const card = document.createElement('div');
        card.className = 'player-card';
        card.innerHTML = `
          <div>
            <strong>${player.name}</strong>
            <div><span>${player.position === 0 ? 'Start' : `Square ${player.position}`}</span></div>
          </div>
          <span style="background:${player.color}; width: 18px; height: 18px; border-radius: 50%; display:inline-block;"></span>
        `;
        playerList.appendChild(card);
      });
    }

    function updateBoardTokens() {
      document.querySelectorAll('.token-list').forEach(node => node.innerHTML = '');
      players.forEach(player => {
        const squareIndex = player.position || 1;
        const targetSquare = squares[player.position] || squares[1];
        const token = document.createElement('div');
        token.className = 'token';
        token.style.background = player.color;
        if (player.position === 0) {
          squares[1].querySelector('.token-list').appendChild(token);
        } else {
          squares[player.position].querySelector('.token-list').appendChild(token);
        }
      });
    }

    function rollDice() {
      if (!gameActive) return;
      const current = players[turnIndex];
      const roll = Math.floor(Math.random() * 6) + 1;
      diceFace.textContent = roll;
      let nextPosition = current.position + roll;
      if (nextPosition > 100) {
        turnText.textContent = `${current.name} needs exact roll for 100.`;
        rollText.textContent = `Rolled ${roll}. Stay at ${current.position}.`;
        nextTurn();
        return;
      }
      current.position = nextPosition;
      if (snakeLadder[nextPosition]) {
        const destination = snakeLadder[nextPosition];
        current.position = destination;
        const type = destination > nextPosition ? 'Climbed ladder' : 'Hit snake';
        turnText.textContent = `${current.name} ${type} to ${destination}.`;
      } else {
        turnText.textContent = `${current.name} moved to ${current.position}.`;
      }
      updateBoardTokens();
      updatePlayersDisplay();
      if (current.position === 100) {
        gameActive = false;
        rollBtn.disabled = true;
        rollText.textContent = `${current.name} wins! Start a new game.`;
        return;
      }
      nextTurn();
    }

    function nextTurn() {
      turnIndex = (turnIndex + 1) % players.length;
      rollText.textContent = `${players[turnIndex].name} is next.`;
    }

    playerCountSelect.addEventListener('change', () => {
      createPlayerInputs();
    });

    newGameBtn.addEventListener('click', () => {
      resetGame();
    });

    rollBtn.addEventListener('click', () => {
      rollDice();
    });

    createPlayerInputs();
    createBoard();
  </script>
</body>
</html>
